name: deploy

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [cicd-sensor-docs-updated]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout site
        uses: actions/checkout@v6
        with:
          path: site

      - name: checkout cicd-sensor docs source
        uses: actions/checkout@v6
        with:
          repository: cicd-sensor/cicd-sensor
          path: source
          ref: main

      - name: install mdbook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: latest

      - name: assemble book
        run: |
          mkdir -p site/build
          cp -r source/docs/src site/build/src

      - name: build
        working-directory: site
        run: mdbook build

      - name: upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/book

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
