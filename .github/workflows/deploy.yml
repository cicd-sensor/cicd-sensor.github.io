name: deploy

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [cicd-sensor-docs-updated]
  workflow_dispatch:
  schedule:
    - cron: '5 */12 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout site
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: site

      - name: checkout cicd-sensor docs source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cicd-sensor/cicd-sensor
          path: source
          ref: main

      - name: cache mdbook tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/mdbook
            ~/.cargo/bin/mdbook-mermaid
          key: mdbook-${{ runner.os }}-${{ hashFiles('site/Cargo.toml') }}

      - name: install mdbook tools
        working-directory: site
        run: make install

      - name: assemble book
        run: cp -r source/docs site/docs

      - name: build
        working-directory: site
        run: mdbook build

      - name: copy static assets
        run: cp -r site/static/. site/book/

      - name: override top page title
        run: sed -i 's|<title>[^<]*</title>|<title>cicd-sensor Docs</title>|' site/book/index.html

      - name: tar pages artifact
        run: |
          tar \
            --dereference --hard-dereference \
            --directory site/book \
            -cvf "${RUNNER_TEMP}/artifact.tar" \
            --exclude=.git \
            --exclude=.github \
            .

      - name: upload pages artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
