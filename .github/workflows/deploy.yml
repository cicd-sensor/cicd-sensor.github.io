name: deploy

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [cicd-sensor-docs-updated]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout site
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: site

      - name: checkout cicd-sensor docs source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: cicd-sensor/cicd-sensor
          path: source
          ref: main

      - name: cache mdbook tools
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/bin/mdbook
            ~/.cargo/bin/mdbook-mermaid
          key: mdbook-${{ runner.os }}-${{ hashFiles('site/Cargo.toml') }}

      - name: install mdbook tools
        working-directory: site
        run: make install

      - name: assemble book
        run: |
          mkdir -p site/build
          cp -r source/docs site/build/src

      - name: build
        working-directory: site
        run: mdbook build

      - name: upload pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/book

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
